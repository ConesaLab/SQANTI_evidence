project:
  genome: ""
  input: ""
  outdir: "SQANTI_evidence_results"
  toolsdir: "/home/pabloati/Programs/lr_annotation"
  prediction_genome: "" # Defaults to project.genome if empty
  log_level: "INFO"

training:
  mode: "mixed" # Options: mixed, busco_only, sqanti_only
  lineage: "eutheria_odb10"
  miniprot_threshold: 0.95
  flanking_region: 1000
  test_size: 5000
  busco_downloads: "busco_downloads"

prediction:
  species: "trial"
  mode: "split" # Options: split, full
  utr: True
  hint_config: "envs/hint_config.tsv"
  hint_weights: "envs/extrinsic.hints_conf.Ale.cfg"

curation:
  mode: "placebo" # Options: ab_initio, placebo, user
  user_gtf: ""    # Path to custom GTF if mode is 'user'
  filter_rules: "envs/filter_rules.json"

evaluation:
  reference_gtf: ""
  omark_db: "LUCA"
  omark_taxid: 10090

resources:
  small:
    cpus: 2
    mem: "8GB"
    time: "2h"
    qos: "short"
  medium:
    cpus: 8
    mem: "12GB"
    time: "10h"
    qos: "short"
  big:
    cpus: 10
    mem: "20GB"
    time: "24h"
    qos: "long"
  busco:
    cpus: 30
    mem: "60GB"
    time: "72h"
    qos: "long"
  small_bigMem:
    mem: "20GB"
