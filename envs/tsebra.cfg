# TSEBRA configuration for SQANTI-evidence
# Evidence source weights
P = 1.5
lrRNA = 1.0

# Feature scoring weights
w_intron = 1.0
w_exon = 0.5
w_start = 1.0
w_stop = 1.0

# Threshold parameters
# e_1: Minimum fraction of supported introns for multi-exon genes (0.1 allows ab initio gap-filling in unexpressed regions)
e_1 = 0.1
# e_2: Minimum fraction of supported CDS for single-exon genes (0.5 filters spurious monoexons)
e_2 = 0.5
# e_3: Maximum fraction of unsupported/conflicted introns
e_3 = 0.2
# e_4: Penalty for unsupported start/stop
e_4 = 0.0
