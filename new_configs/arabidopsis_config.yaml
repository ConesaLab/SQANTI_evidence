project:
  genome: "data/arabidopsis/Arabidopsis_thaliana.TAIR10.dna.toplevel.fa"
  input: "data/arabidopsis/ERR15191386_clustered.converted.bam"
  outdir: "results/arabidopsis_SQeviq"
  toolsdir: "/home/patienza/Programs/lr_annotation"
  log_level: "INFO"

training:
  lineage: "brassicales_odb12"
  miniprot_threshold: 0.95
  flanking_region: 1000
  test_size: 5000

prediction:
  species: "arabidopsis_thaliana"
  mode: "split"
  utr: False

curation:
  mode: "placebo"
  filter_rules: "data/filter_rules.json"

evaluation:
  reference_gtf: "data/arabidopsis/Arabidopsis_thaliana.TAIR10.62.gff3.cds.gtf"
  omark_db: "LUCA"
  omark_taxid: 3702

resources:
  small:
    cpus: 2
    mem: "8G"
    time: "2h"
    qos: "short"
  medium:
    cpus: 8
    mem: "120G"
    time: "10h"
    qos: "short"
  big:
    cpus: 10
    mem: "30G"
    time: "24h"
    qos: "long"
  busco:
