# Dry-run fixture: training.mode=busco_only, prediction.mode=split, curation.mode=ab_initio (the only training mode compatible with an ab initio SQANTI3 reference).
project:
  genome: "tests/dryrun/data/genome.fa"
  input: "tests/dryrun/data/reads.fastq"
  outdir: "tests/dryrun/results/busco_only_split_abinitio"
  toolsdir: "tests/dryrun/tools"
training:
  mode: "busco_only"
  lineage: "dummy_odb12"
prediction:
  species: "dryrun_species"
  mode: "split"
  utr: False
curation:
  mode: "ab_initio"
evaluation:
  reference_gtf: "tests/dryrun/data/reference.gtf"
